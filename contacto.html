<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Andrey Arciniegas</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!--
    Estructura HTML5:
    HEADER: contiene la navegación.
    NAV: permite desplazarse por el sitio.
    MAIN: contiene el formulario.
    SECTION: organiza el contenido.
    FOOTER: contiene la información final.
-->
    <!--
        NAV:
        Barra de navegación utilizando componentes
        y clases de Bootstrap.
    -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Andrey Arciniegas
                </a>

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="servicios.html">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="contacto.html">
                                Contacto
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <!--
        MAIN:
        Contenido principal de la página.
    -->
    <main>
        <!-- MAIN: contenido principal de la página -->

        <section class="hero text-center">

            <div class="container">

                <h1>Contacto</h1>

                <p class="lead">
                    Envíame un mensaje utilizando el siguiente formulario.
                </p>

            </div>

        </section>


        <!-- Formulario -->
        <section class="container my-5">

            <div class="row justify-content-center">

                <div class="col-md-8">

                    <div class="info-box">

                        <h2 class="text-center mb-4">
                            Formulario de contacto
                        </h2>

                        <form>

                            <!-- Nombre -->
                            <div class="mb-3">

                                <label for="nombre"
                                    class="form-label">
                                    Nombre
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="nombre"
                                    placeholder="Escribe tu nombre"
                                    required>

                            </div>


                            <!-- Correo -->
                            <div class="mb-3">

                                <label for="correo"
                                    class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="correo"
                                    placeholder="ejemplo@correo.com"
                                    required>

                            </div>


                            <!-- Asunto -->
                            <div class="mb-3">

                                <label for="asunto"
                                    class="form-label">
                                    Asunto
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="asunto"
                                    placeholder="Escribe el asunto"
                                    required>

                            </div>


                            <!-- Mensaje -->
                            <div class="mb-3">

                                <label for="mensaje"
                                    class="form-label">
                                    Mensaje
                                </label>

                                <textarea
                                    class="form-control"
                                    id="mensaje"
                                    rows="5"
                                    placeholder="Escribe tu mensaje"
                                    required></textarea>

                            </div>


                            <!-- Botón -->
                            <div class="text-center">

                                <button type="submit"
                                    class="btn btn-primary">
                                    Enviar mensaje
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER: pie de página -->
    <footer class="bg-dark text-white text-center p-4">

        <p class="mb-0">
            Laboratorio 5.2 - Andrey Arciniegas
        </p>

    </footer>


    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
